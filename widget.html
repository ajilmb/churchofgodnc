<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathews B Widget</title>
    <!-- Imported Arimo Font for consistency -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            font-family: 'Arimo', sans-serif;
            overflow: hidden;
            padding: 15px;
            box-sizing: border-box;
        }

        /* Main Container with Breathing Animation */
        .widget-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            animation: breathe 4s infinite ease-in-out;
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 15px;
            background: radial-gradient(circle, rgba(0, 20, 0, 1) 0%, rgba(0, 0, 0, 1) 100%);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.1);
            position: relative;
        }

        @keyframes breathe {

            0%,
            100% {
                transform: scale(0.98);
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.1);
            }

            50% {
                transform: scale(1.0);
                box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            }
        }

        /* Top Section: Date & Time */
        .time-date-container {
            text-align: center;
            margin-top: 15px;
        }

        .clock {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.6);
            line-height: 1;
        }

        .date {
            font-size: 11px;
            letter-spacing: 2px;
            opacity: 0.7;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Middle Section: Cyber Oracle (Funny/Useful) */
        .oracle-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 10px;
            cursor: pointer;
            width: 80%;
        }

        .oracle-text {
            font-size: 13px;
            line-height: 1.4;
            color: #fff;
            min-height: 40px;
            font-style: italic;
        }

        .oracle-label {
            font-size: 9px;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 3px 8px;
            border-radius: 10px;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            transition: all 0.2s;
        }

        .oracle-container:active .oracle-label {
            background: #00ff00;
            color: #000;
        }

        /* Bottom Section: Logo & Actions */
        .bottom-section {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .widget-logo {
            width: 30px;
            height: 30px;
            opacity: 0.6;
        }

        .widget-btn {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 6px 16px;
            text-decoration: none;
            font-size: 10px;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .widget-btn:active {
            background: #00ff00;
            color: #000000;
        }
    </style>
</head>

<body>

    <div class="widget-content">
        <!-- Time & Date -->
        <div class="time-date-container">
            <div id="clock" class="clock">00:00</div>
            <div id="date" class="date">LOADING...</div>
        </div>

        <!-- Cyber Oracle -->
        <div class="oracle-container" id="oracleBox">
            <div class="oracle-text" id="oracleText">"INITIALIZING SYSTEM..."</div>
            <div class="oracle-label">TAP FOR WISDOM</div>
        </div>

        <!-- Bottom -->
        <div class="bottom-section">
            <img src="Images/widget.svg" alt="Logo" class="widget-logo">
            <a href="./index.html" class="widget-btn">OPEN APP</a>
        </div>
    </div>

    <script>
        // --- 1. CLOCK & DATE LOGIC ---
        function updateTime() {
            const now = new Date();

            // Time (12-hour HH:MM)
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';

            hours = hours % 12;
            hours = hours ? hours : 12;
            const strHours = String(hours).padStart(2, '0');

            document.getElementById('clock').innerHTML = `${strHours}:${minutes}<span style="font-size:0.4em; vertical-align:top; margin-left:3px; opacity:0.7;">${ampm}</span>`;

            // Date
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            const dateStr = now.toLocaleDateString('en-US', options).toUpperCase();
            document.getElementById('date').textContent = dateStr;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // --- 2. CYBER ORACLE LOGIC ---
        const quotes = [
            "IT WORKS ON MY MACHINE.",
            "HAVE YOU TRIED TURNING IT OFF AND ON AGAIN?",
            "THERE IS NO PLACE LIKE 127.0.0.1",
            "I AM NOT A BUG, I AM A FEATURE.",
            "CTRL + Z IS A TIME MACHINE.",
            "REAL PROGRAMMERS COUNT FROM 0.",
            "ERROR 404: MOTIVATION NOT FOUND.",
            "COFFEE: THE SOURCE CODE OF LIFE.",
            "TO ERR IS HUMAN, TO DEBUG DIVINE.",
            "IF IT COMPILES, SHIP IT.",
            "YOUR PASSWORD IS 'PASSWORD', ISN'T IT?",
            "418 I'M A TEAPOT.",
            "KEEP CALM AND COMMIT.",
            "SELECT * FROM USERS WHERE CLUE > 0;",
            "A WAIT OF 1000MS IS A LONG TIME."
        ];

        const oracleBox = document.getElementById('oracleBox');
        const oracleText = document.getElementById('oracleText');

        function showRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            oracleText.style.opacity = 0;
            setTimeout(() => {
                oracleText.textContent = `"${quotes[randomIndex]}"`;
                oracleText.style.opacity = 1;
            }, 200);
        }

        // Suggest a quote on tap
        oracleBox.addEventListener('click', showRandomQuote);

        // Initial Quote
        showRandomQuote();

    </script>
</body>

</html>
