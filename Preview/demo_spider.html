<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider Animation Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #33ca36;
            /* Green Screen */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SPIDER WRAPPER --- */
        .spider-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            opacity: 0;
            /* Animation timing matches the real app */
            animation: spider-walk-entry 2.5s cubic-bezier(0.25, 1, 0.5, 1) 0.5s forwards;
            filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.5));
        }

        .rockstar-logo {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            display: block;
        }

        /* --- SPIDER FACE ELEMENTS --- */
        .spider-eye {
            position: absolute;
            top: 20%;
            width: 14px;
            height: 14px;
            background-color: #fff;
            border-radius: 50%;
            animation: blink-anim 3.5s infinite;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        .spider-eye.left {
            left: 15%;
        }

        .spider-eye.right {
            right: 15%;
        }

        /* Pupils */
        .spider-eye::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-20%, -20%);
            width: 6px;
            height: 6px;
            background-color: #000;
            border-radius: 50%;
        }

        .spider-mouth {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 8px;
            background-color: transparent;
            border-bottom: 3px solid #fff;
            border-radius: 50%;
            animation: mouth-anim 2s infinite alternate ease-in-out;
            z-index: 10;
        }

        /* --- ANIMATIONS --- */
        @keyframes spider-walk-entry {
            0% {
                transform: translateX(-120vw) rotate(-20deg) scale(0.5);
                opacity: 0;
            }

            10% {
                opacity: 1;
                transform: translateX(-90vw) rotate(15deg) scale(0.6);
            }

            20% {
                transform: translateX(-70vw) rotate(-15deg) scale(0.7);
            }

            30% {
                transform: translateX(-50vw) rotate(15deg) scale(0.8);
            }

            40% {
                transform: translateX(-30vw) rotate(-10deg) scale(0.9);
            }

            50% {
                transform: translateX(-15vw) rotate(10deg) scale(0.95);
            }

            60% {
                transform: translateX(-5vw) rotate(-5deg) scale(1);
            }

            70% {
                transform: translateX(0) rotate(0deg) scale(1.1);
            }

            80% {
                transform: translateX(0) rotate(5deg) scale(1.05);
            }

            90% {
                transform: translateX(0) rotate(-3deg) scale(1);
            }

            100% {
                transform: translateX(0) rotate(0deg) scale(1);
                opacity: 1;
            }
        }

        @keyframes blink-anim {

            0%,
            45%,
            55%,
            100% {
                transform: scaleY(1);
            }

            50% {
                transform: scaleY(0.1);
            }
        }

        @keyframes mouth-anim {
            0% {
                width: 15px;
                height: 6px;
                border-bottom: 3px solid #fff;
            }

            100% {
                width: 10px;
                height: 10px;
                border: 2px solid #fff;
                background: #000;
                border-radius: 50%;
                border-bottom: 2px solid #fff;
            }
        }
    </style>
</head>

<body>

    <div class="spider-wrapper">
        <!-- Using the actual image path from your project -->
        <img src="../Images/favicon.svg" alt="M Logo" class="rockstar-logo">

        <!-- Face -->
        <div class="spider-eye left"></div>
        <div class="spider-eye right"></div>
        <div class="spider-mouth"></div>
    </div>

</body>

</html>
