<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install Popup Preview</title>
    <!-- Importing Arimo Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arimo', sans-serif;
            background-image: url('../Images/me.png');
            background-size: cover;
        }

        /* Overlay */
        .preview-overlay {
            position: fixed;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 10001;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Popup Mockup */
        .preview-content {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgb(0, 255, 0);
            border-radius: 4px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: rgba(0, 255, 0, 0.2) 0px 0px 20px;
            font-family: Arimo, sans-serif;
            position: relative;
            transform: scale(1);
        }
    </style>
</head>

<body>

    <div class="preview-overlay">
        <div class="preview-content">
            <button id="pwaCloseBtn"
                style="position:absolute; top:12px; right:20px; background:transparent; border:none; color:#fff; font-size:25px; cursor:pointer; line-height:1;">×</button>
            <h3 style="color:#00ff00; margin-top:0; letter-spacing:1px;">INSTALL APPLICATION</h3><br>
            <p style="color:#fff; font-size:15px; line-height:1.5;">
                Install this application on your home screen for quick access and better performance.
            </p>
            <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
                <button id="pwaCancel"
                    style="background:transparent;color:#fff;border:1px solid #555;padding:8px 20px;border-radius: 2px;cursor:pointer;">LATER</button>
                <button id="pwaConfirm"
                    style="background:#00ff00;color:#000;border:none;padding:8px 20px;border-radius: 2px;font-weight:bold;cursor:pointer;">INSTALL</button>
            </div>
        </div>
    </div>

</body>

</html>
